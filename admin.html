<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>文章审核后台</title> 
<style>
*{font-family:system-ui,sans-serif;box-sizing:border-box;margin:0;padding:0}
body{padding:30px;background:#f3f4f6}
.login-box{background:#fff;padding:24px;border-radius:10px;max-width:400px}
.item{background:#fff;padding:20px;border-radius:10px;margin-bottom:16px;box-shadow:0 2px 8px #00000010}
.btns{margin-top:12px;gap:10px;display:flex}
.pass{background:#22c55e;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer}
.reject{background:#ef4444;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer}
#adminPanel{display:none}
.section{margin:30px 0;}
</style>
</head>
<body>
<div class="login-box" id="loginBox">
  <h3>管理员登录</h3>
  <input type="password" id="pwdInput" placeholder="输入管理员密码" style="width:100%;padding:8px;margin:12px 0;">
  <button onclick="login()" style="padding:8px 16px;cursor:pointer;">登录</button>
</div>
<div id="adminPanel">
<div class="section">
  <h2>待审核【文章】</h2>
  <div id="textListWrap"></div>
</div>
<div class="section">
  <h2>待审核【论坛帖子】</h2>
  <div id="articleListWrap"></div>
</div>
</div>
<script>
let password="";
async function login(){
  password=document.getElementById("pwdInput").value;
  // 先用pendingText测试登录有效性
  const res=await fetch(`/api?action=pendingText&pwd=${password}`);
  const ret=await res.json();
  if(ret.ok){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("adminPanel").style.display="block";
    loadAllPending();
  }else{
    alert(ret.msg);
  }
}

// 一次性加载文章+帖子待审核列表
async function loadAllPending(){
  await loadPendingText();
  await loadPendingArticle();
}

// 加载待审核文章 texts
async function loadPendingText(){
  const res=await fetch(`/api?action=pendingText&pwd=${password}`);
  const ret=await res.json();
  const wrap=document.getElementById("textListWrap");
  wrap.innerHTML="";
  if(ret.data.length===0){
    wrap.innerHTML="<p>暂无待审核文章</p>";
    return;
  }
  ret.data.forEach(art=>{
    const div=document.createElement("div");
    div.className="item";
    div.innerHTML=`
      <h3>${art.title}</h3>
      <div>作者：${art.author}｜${art.create_time}</div>
      <pre style="white-space:pre-wrap;margin:10px 0;">${art.content}</pre>
      <div class="btns">
        <button class="pass" data-id="${art.id}">通过</button>
        <button class="reject" data-id="${art.id}">驳回</button>
      </div>
    `;
    wrap.appendChild(div);
  })
  // 文章审核按钮
  document.querySelectorAll("#textListWrap .pass").forEach(btn=>{
    btn.onclick=async ()=>{
      const id=btn.dataset.id;
      const res=await fetch(`/api?action=auditText&pwd=${password}`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({id,status:"approved"})
      })
      const ret=await res.json();
      alert(ret.msg);
      loadAllPending();
    }
  })
  document.querySelectorAll("#textListWrap .reject").forEach(btn=>{
    btn.onclick=async ()=>{
      const id=btn.dataset.id;
      const res=await fetch(`/api?action=auditText&pwd=${password}`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({id,status:"rejected"})
      })
      const ret=await res.json();
      alert(ret.msg);
      loadAllPending();
    }
  })
}

// 加载待审核论坛帖子 articles
async function loadPendingArticle(){
  const res=await fetch(`/api?action=pendingArticle&pwd=${password}`);
  const ret=await res.json();
  const wrap=document.getElementById("articleListWrap");
  wrap.innerHTML="";
  if(ret.data.length===0){
    wrap.innerHTML="<p>暂无待审核帖子</p>";
    return;
  }
  ret.data.forEach(art=>{
    const div=document.createElement("div");
    div.className="item";
    div.innerHTML=`
      <h3>${art.title}</h3>
      <div>作者：${art.author}｜${art.create_time}</div>
      <pre style="white-space:pre-wrap;margin:10px 0;">${art.content}</pre>
      <div class="btns">
        <button class="pass" data-id="${art.id}">通过</button>
        <button class="reject" data-id="${art.id}">驳回</button>
      </div>
    `;
    wrap.appendChild(div);
  })
  //帖子审核按钮，action=auditArticle
  document.querySelectorAll("#articleListWrap .pass").forEach(btn=>{
    btn.onclick=async ()=>{
      const id=btn.dataset.id;
      const res=await fetch(`/api?action=auditArticle&pwd=${password}`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({id,status:"approved"})
      })
      const ret=await res.json();
      alert(ret.msg);
      loadAllPending();
    }
  })
  document.querySelectorAll("#articleListWrap .reject").forEach(btn=>{
    btn.onclick=async ()=>{
      const id=btn.dataset.id;
      const res=await fetch(`/api?action=auditArticle&pwd=${password}`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({id,status:"rejected"})
      })
      const ret=await res.json();
      alert(ret.msg);
      loadAllPending();
    }
  })
}
</script>
</body>
</html>
