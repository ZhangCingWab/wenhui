<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>比赛作品审核打分</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:1200px;margin:2rem auto;padding:0 1rem}
.panel{border:1px solid #ccc;border-radius:8px;padding:1.5rem;margin-bottom:1rem}
.item{border:1px solid #eee;padding:1rem;margin:0.8rem 0;border-radius:6px}
.login-area{margin-bottom:2rem}
input,button{padding:8px 10px;font-size:1rem;margin:4px}
.score-input{width:80px}
.article-content{background:#f7f7f7;padding:10px;margin:8px 0;white-space:pre-wrap;max-height:250px;overflow:auto}
</style>
</head>
<body>
<h1>写作比赛 - 作品打分后台</h1>

<!-- 管理员登录区：只需要输入密码，不需要填比赛ID -->
<div class="panel login-area">
  <h3>管理员登录</h3>
  <input type="password" id="adminPwd" placeholder="输入管理员密码">
  <button onclick="adminLogin()">登录加载全部稿件</button>
</div>

<!-- 筛选（可选，方便单独看某场比赛） -->
<div class="panel" id="filterBox" style="display:none">
  <h3>筛选稿件</h3>
  <input type="number" id="filterCid" placeholder="输入比赛ID筛选，留空显示全部">
  <button onclick="renderList()">筛选</button>
</div>

<!-- 稿件列表区域 -->
<div id="listBox" style="display:none"></div>

<script>
const API_HOST = "你的worker地址";
let allSubmitData = [];

async function adminLogin(){
  const pwd = document.getElementById("adminPwd").value;
  const res = await fetch(`${API_HOST}?action=adminLogin&pwd=${pwd}`,{
    method:"GET",
    headers:{"Content-Type":"application/json"}
  })
  const ret = await res.json();
  if(ret.ok){
    alert("管理员验证成功，正在加载所有提交作品");
    document.getElementById("filterBox").style.display="block";
    document.getElementById("listBox").style.display="block";
    loadAllSubmits();
  }else{
    alert("密码错误，无权限");
  }
}

// 加载所有提交记录（全部比赛的稿件一次性拉取）
async function loadAllSubmits(){
  const res = await fetch(`${API_HOST}?action=getAllSubmits`,{method:"POST"});
  allSubmitData = await res.json();
  renderList();
}

// 渲染稿件列表
function renderList(){
  const cidFilter = document.getElementById("filterCid").value.trim();
  let list = allSubmitData;
  if(cidFilter){
    list = list.filter(item=>item.contest_id == cidFilter)
  }
  const box = document.getElementById("listBox");
  let html = "";
  list.forEach(item=>{
    html += `
    <div class="item">
      <p><b>比赛ID：${item.contest_id} | 题目ID：${item.problem_id} | 作者：${item.author_name}</b></p>
      <p>字数：${item.word_count} | 当前分数：<input class="score-input" type="number" id="score_${item.id}" value="${item.score??''}"></p>
      <div class="article-content">${item.content}</div>
      <button onclick="saveScore(${item.id})">保存该稿件分数</button>
    </div>
    `
  })
  box.innerHTML = html;
}

// 保存单篇稿件分数
async function saveScore(submitId){
  const score = document.getElementById(`score_${submitId}`).value;
  const res = await fetch(`${API_HOST}?action=setScore&submit_id=${submitId}&score=${score}`,{
    method:"POST"
  })
  const ret = await res.json();
  if(ret.ok) alert("分数保存成功！");
  else alert("保存失败");
}
</script>
</body>
</html>
