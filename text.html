<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写文章 | 文汇</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
        body{background:#edf2f7;color:#2d3748;line-height:1.6;}
        nav{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.06);padding:1rem 8%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99;}
        .logo{font-size:1.5rem;font-weight:700;color:#3182ce;cursor:pointer;}
        .nav-btn-group{display:flex;gap:12px;}
        button{padding:8px 16px;border-radius:6px;border:none;font-size:0.95rem;cursor:pointer;transition:all 0.2s ease;}
        button:active{transform:scale(0.96);}
        .btn-primary{background:#3182ce;color:#fff;}
        .btn-primary:hover{background:#2b6cb0;}
        .help-btn{padding:6px 14px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;}
        /* Word风格工具栏 */
        .toolbar{background:#fff;padding:12px 24px;border-bottom:1px solid #e2e8f0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
        .toolbar button{padding:6px 10px;font-size:0.9rem;background:#f7fafc;border:1px solid #e2e8f0;color:#2d3748;}
        .toolbar button:hover{background:#e2e8f0;}
        .toolbar select{padding:5px 8px;border:1px solid #e2e8f0;border-radius:6px;outline:none;}
        .container{max-width:1200px;margin:24px auto;padding:0 2rem 4rem 90px;}
        .editor-wrap{background:#fff;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,0.05);overflow:hidden;}
        .title-input{width:100%;font-size:2rem;padding:16px 24px;border:none;border-bottom:2px solid #e2e8f0;outline:none;}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:0;}
        .content-textarea{width:100%;min-height:520px;font-size:1rem;padding:24px;border:none;outline:none;font-family:Consolas,Monaco,monospace;resize:vertical;}
        .preview{min-height:520px;padding:24px;border-left:1px solid #e2e8f0;overflow:auto;background:#fff;}
        .submit-area{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e2e8f0;}
        .left-sidebar{position:fixed;left:0;top:0;height:100vh;background:#fff;box-shadow:2px 0 8px rgba(0,0,0,0.06);width:60px;transition:width 0.25s ease;z-index:98;display:flex;flex-direction:column;justify-content:flex-start;padding-top:16px;}
        .left-sidebar:hover{width:180px;}
        .left-nav-item{display:flex;align-items:center;gap:16px;padding:14px 16px;cursor:pointer;white-space:nowrap;}
        .left-nav-item:hover{background:#f7fafc;}
        .left-nav-item .icon{font-size:22px;width:24px;text-align:center;}
        .left-nav-item .text{opacity:0;transition:opacity 0.2s ease;}
        .left-sidebar:hover .text{opacity:1;}
        .preview h1{font-size:2rem;margin:0.8rem 0;border-bottom:1px solid #eee;padding-bottom:0.3rem;}
        .preview h2{font-size:1.6rem;margin:0.7rem 0;}
        .preview h3{font-size:1.3rem;margin:0.6rem 0;}
        .preview p{margin:0.5rem 0;}
        .preview ul,.preview ol{margin:0.5rem 0;padding-left:1.8rem;}
        .preview a{color:#3182ce;}
        .preview blockquote{border-left:4px solid #d1d5db;padding-left:12px;color:#555;margin:0.6rem 0;}
        .preview pre{background:#f6f8fa;padding:12px;border-radius:6px;overflow-x:auto;margin:0.6rem 0;}
        .preview code{background:#f1f3f4;padding:2px 4px;border-radius:4px;font-size:0.95em;}
        .preview pre code{background:transparent;padding:0;}
        .preview table{border-collapse:collapse;margin:0.8rem 0;}
        .preview th,.preview td{border:1px solid #e2e8f0;padding:8px 12px;}
        .preview img{max-width:100%;border-radius:6px;}
        .modal{display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:1000;}
        .modal-box{width:700px;max-width:90%;max-height:80vh;overflow:auto;background:#fff;margin:80px auto;padding:24px;border-radius:12px;}
        .modal-close{float:right;cursor:pointer;font-size:22px;}
    </style>
</head>
<body>
<div class="left-sidebar">
    <div class="left-nav-item" onclick="location.href='/'">
        <span class="icon">🏠</span>
        <span class="text">主页</span>
    </div>
    <div class="left-nav-item" onclick="location.href='/articlelist.html'">
        <span class="icon">📄</span>
        <span class="text">文章库</span>
    </div>
    <div class="left-nav-item" onclick="location.href='/forum.html'">
        <span class="icon">💬</span>
        <span class="text">论坛广场</span>
    </div>
</div>
<nav>
    <div class="logo" onclick="location.href='/'">文汇</div>
    <div class="nav-btn-group">
        <button class="help-btn" id="helpBtn">Markdown帮助</button>
    </div>
</nav>
<div class="container">
    <div class="editor-wrap">
        <!-- Word/WPS 风格工具栏 -->
        <div class="toolbar">
            <select id="fontSizeSelect">
                <option value="12">12px</option>
                <option value="14" selected>14px</option>
                <option value="16">16px</option>
                <option value="18">18px</option>
                <option value="20">20px</option>
            </select>
            <button onclick="insertText('** **')">B 加粗</button>
            <button onclick="insertText('* *')">I 斜体</button>
            <button onclick="insertText('~~ ~~')">S 删除线</button>
            <button onclick="insertText('# ')">H1标题</button>
            <button onclick="insertText('## ')">H2标题</button>
            <button onclick="insertText('> ')">引用</button>
            <button onclick="insertText('- ')">无序列表</button>
            <button onclick="insertText('\n```cpp\n\n```\n')">代码块</button>
        </div>
        <input class="title-input" placeholder="请输入文章标题" id="articleTitle">
        <div class="row">
            <textarea class="content-textarea" id="articleContent" placeholder="在这里撰写文章，支持Markdown语法，选中文字后点上方工具栏按钮，右侧实时预览">
# 示例文章标题
选中文字，点击上方加粗、斜体按钮即可快速排版。
            </textarea>
            <div class="preview" id="previewBox">
                <p style="color:#a0aec0">右侧预览文章渲染效果...</p>
            </div>
        </div>
        <div class="submit-area">
            <span>文章编辑器 · Markdown</span>
            <button class="btn-primary" id="publishBtn">发布文章</button>
        </div>
    </div>
</div>
<div class="modal" id="helpModal">
    <div class="modal-box">
        <span class="modal-close" id="closeModal">×</span>
        <h3>Markdown 语法说明</h3>
        <br>
        <p><strong>标题</strong></p>
        <p><code># 一级标题</code></p>
        <p><code>## 二级标题</code></p>
        <br>
        <p><strong>文字样式</strong></p>
        <p><code>**加粗文本**</code></p>
        <p><code>*斜体文本*</code></p>
        <p><code>~~删除线~~</code></p>
        <p><code>`行内代码`</code></p>
        <br>
        <p><strong>引用</strong></p>
        <p><code>> 引用内容</code></p>
    </div>
</div>
<script>
const contentDom=document.getElementById("articleContent");
const previewDom=document.getElementById("previewBox");
const fontSizeSelect=document.getElementById("fontSizeSelect");
// 工具栏：光标位置插入标记
function insertText(str){
    const start=contentDom.selectionStart;
    const end=contentDom.selectionEnd;
    const origin=contentDom.value;
    contentDom.value=origin.substring(0,start)+str+origin.substring(end);
    contentDom.selectionStart=contentDom.selectionEnd=start+str.length/2;
    contentDom.focus();
    renderMarkdown();
}
// 修改编辑器字体大小
fontSizeSelect.onchange=function(){
    contentDom.style.fontSize=this.value+"px";
}
function renderMarkdown(){
    let mdText=contentDom.value;
    if(!mdText){
        previewDom.innerHTML='<p style="color:#a0aec0">右侧预览文章渲染效果...</p>';
        return;
    }
    let html=marked.parse(mdText);
    previewDom.innerHTML=html;
    previewDom.querySelectorAll('pre code').forEach((el)=>{
        try{hljs.highlightElement(el);}catch(e){}
    })
}
contentDom.addEventListener('input',renderMarkdown);
renderMarkdown();
async function handlePublish(){
    const title=document.getElementById("articleTitle").value.trim();
    const content=document.getElementById("articleContent").value.trim();
    if(!title){alert("请填写文章标题！");return;}
    if(!content){alert("文章正文不能为空！");return;}
    try{
        const res=await fetch("/api",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({title,content})
        });
        const ret=await res.json();
        if(ret.ok){alert(ret.msg);}else{alert(ret.msg);}
    }catch(err){
        alert("网络错误，提交失败");
        console.error(err);
    }
}
document.getElementById("publishBtn").onclick=handlePublish;
const modal=document.getElementById("helpModal");
const helpBtn=document.getElementById("helpBtn");
const closeBtn=document.getElementById("closeModal");
helpBtn.onclick=function(){modal.style.display="block";}
closeBtn.onclick=function(){modal.style.display="none";}
window.onclick=function(e){if(e.target===modal)modal.style.display="none";}
</script>
</body>
</html>
