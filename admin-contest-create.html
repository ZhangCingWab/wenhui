<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新建写作比赛</title>
    <style>
        body {font-family:system-ui;max-width:900px;margin:30px auto;padding:0 20px;}
        .hidden {display:none;}
        .item{margin:14px 0;}
        label{display:block;margin-bottom:6px;font-weight:bold;}
        input,textarea{width:100%;padding:8px;box-sizing:border-box;}
        .problem-item{border:1px solid #ccc;padding:12px;margin:10px 0;border-radius:6px;}
        button{padding:9px 16px;cursor:pointer;margin:4px;}
    </style>
</head>
<body>
    <h2>新建写作比赛</h2>
    <!-- 密码弹窗区域 -->
    <div id="loginBox">
        <div class="item">
            <label>管理员密码</label>
            <input type="password" id="pwdInput" placeholder="输入管理员密码">
        </div>
        <button onclick="checkAdminPwd()">验证登录</button>
    </div>

    <!-- 比赛表单（密码验证通过才显示） -->
    <div id="contestFormBox" class="hidden">
        <div class="item">
            <label>比赛标题</label>
            <input type="text" id="title" placeholder="例如：第一届文汇写作大赛">
        </div>
        <div class="item">
            <label>比赛开始时间</label>
            <input type="datetime-local" id="startTime">
        </div>
        <div class="item">
            <label>比赛结束时间</label>
            <input type="datetime-local" id="endTime">
        </div>
        <h3>比赛题目</h3>
        <div id="problemList"></div>
        <button onclick="addProblem()">增加一道题目</button>
        <br><br>
        <button onclick="submitContest()">提交创建比赛</button>
    </div>

<script>
    // ========== 前端写死密码，只在前端做密码校验，不调用后端验证密码 ==========
    const adminPwdCorrect = "123456";
    let currentAdminPwd = "";
    // 替换成你的Worker地址
    const WORKER_URL = "这里替换成你的worker网址";

    // 前端本地校验密码，不请求后端
    function checkAdminPwd(){
        const inputVal = document.getElementById("pwdInput").value.trim();
        if(inputVal === adminPwdCorrect){
            currentAdminPwd = inputVal;
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("contestFormBox").classList.remove("hidden");
            alert("密码验证成功，可以创建比赛");
        }else{
            alert("密码错误！");
        }
    }

    // 添加题目块
    function addProblem(){
        const wrap = document.getElementById("problemList");
        const div = document.createElement("div");
        div.className = "problem-item";
        div.innerHTML = `
            <label>题目主题</label>
            <textarea class="topic" placeholder="写作题目要求"></textarea>
            <label>最少字数</label>
            <input class="min_words" type="number" value="0">
            <label>最多字数</label>
            <input class="max_words" type="number" value="2000">
            <button onclick="this.parentElement.remove()">删除该题</button>
        `;
        wrap.appendChild(div);
    }

    // 提交比赛数据，POST上传到后端Worker
    async function submitContest(){
        const title = document.getElementById("title").value.trim();
        const start_time = document.getElementById("startTime").value;
        const end_time = document.getElementById("endTime").value;
        const problemDomList = document.querySelectorAll(".problem-item");
        const problems = [];
        for(let p of problemDomList){
            const topic = p.querySelector(".topic").value.trim();
            const min_words = parseInt(p.querySelector(".min_words").value);
            const max_words = parseInt(p.querySelector(".max_words").value);
            if(!topic){
                alert("题目主题不能为空");
                return;
            }
            problems.push({topic,min_words,max_words});
        }
        if(!title || !start_time || !end_time || problems.length===0){
            alert("请补全比赛信息，至少添加一道题目");
            return;
        }

        // 请求后端addContest接口，带上pwd参数
        const res = await fetch(`${WORKER_URL}?action=addContest&pwd=${currentAdminPwd}`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                title,
                start_time,
                end_time,
                problems
            })
        });
        const data = await res.json();
        alert(data.msg);
        if(data.ok){
            // 成功清空表单
            document.getElementById("title").value="";
            document.getElementById("problemList").innerHTML="";
        }
    }

    // 默认预先添加1道题目
    addProblem();
</script>
</body>
</html>
