<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件投稿 | 文汇</title> 
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
body{background-color:#f7fafc;color:#2d3748;line-height:1.6;}
nav{background:transparent;box-shadow:none;padding:1rem 8%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99;margin:0;}
.logo{font-size:1.5rem;font-weight:700;color:#3182ce;cursor:pointer;}
button{padding:10px 22px;border-radius:8px;border:none;font-size:1rem;cursor:pointer;transition:all 0.2s ease;}
button:active{transform:scale(0.96);}
.btn-outline{background:transparent;border:1px solid #3182ce;color:#3182ce;}
.btn-primary{background:#3182ce;color:white;}
.btn-primary:hover{background:#2b6cb0;}
.container{max-width:1080px;margin:0 auto;padding:4rem 2rem 4rem 90px;}
.box{background:#fff;border-radius:14px;padding:32px;box-shadow:0 3px 10px rgba(0,0,0,0.05);}
h2{margin-bottom:24px;}
input[type="text"],input[type="file"]{width:100%;padding:12px;margin-bottom:16px;border:1px solid #cbd5e0;border-radius:8px;font-size:1rem;}
textarea{width:100%;min-height:240px;padding:12px;border:1px solid #cbd5e0;border-radius:8px;font-size:1rem;margin-bottom:16px;resize:vertical;}
.left-sidebar{position:fixed;left:0;top:0;height:100vh;background:#ffffff;box-shadow:2px 0 8px rgba(0,0,0,0.06);width:60px;transition:width 0.25s ease;z-index:98;display:flex;flex-direction:column;justify-content:flex-start;padding-top:16px;}
.left-sidebar:hover{width:180px;}
.left-nav-item{display:flex;align-items:center;gap:16px;padding:14px 16px;cursor:pointer;white-space:nowrap;}
.left-nav-item:hover{background:#f7fafc;}
.left-nav-item .icon{font-size:22px;width:24px;text-align:center;}
.left-nav-item .text{opacity:0;transition:opacity 0.2s ease;}
.left-sidebar:hover .text{opacity:1;}
</style>
<!-- 引入 mammoth.js 用来解析 docx -->
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.4.21/mammoth.browser.min.js"></script>
</head>
<body>
<div class="left-sidebar">
<div class="left-nav-item" onclick="location.href='/'"><span class="icon">🏠</span><span class="text">主页</span></div>
<div class="left-nav-item" onclick="location.href='/articlelist.html'"><span class="icon">📚</span><span class="text">论坛广场</span></div>
<div class="left-nav-item" onclick="location.href='/submit.html'"><span class="icon">📄</span><span class="text">文件投稿</span></div>
<div class="left-nav-item"><span class="icon">💬</span><span class="text">讨论区</span></div>
</div>
<nav>
<div class="logo" onclick="location.href='/'">文汇</div>
</nav>
<div class="container">
<div class="box">
<h2>📄 文件投稿（支持txt / docx）</h2>
<input type="text" id="title" placeholder="输入作品标题">
<!-- 修改accept，支持txt和docx -->
<input type="file" id="fileInput" accept=".txt,.docx">
<p style="margin-bottom:8px;color:#4a5568;">预览文件内容（可手动修改）：</p>
<textarea id="content" placeholder="上传txt/docx文件后内容会显示在这里"></textarea>
<button class="btn-primary" id="submitBtn">提交投稿</button>
</div>
</div>
<script>
const fileInput=document.getElementById("fileInput");
const contentDom=document.getElementById("content");
const titleDom=document.getElementById("title");
const submitBtn=document.getElementById("submitBtn");

fileInput.onchange=async function(){
    const f=this.files[0];
    if(!f)return;
    const fileName = f.name.toLowerCase();
    contentDom.value = "正在读取文件...";
    try{
        // txt 纯文本
        if(fileName.endsWith(".txt")){
            const reader=new FileReader();
            reader.onload=e=>{
                contentDom.value=e.target.result;
                if(!titleDom.value){
                    titleDom.value=f.name.replace(/\.txt$/i,"");
                }
            };
            reader.readAsText(f,"UTF-8");
        }
        // docx / WPS文字文档
        else if(fileName.endsWith(".docx")){
            const arrayBuf = await f.arrayBuffer();
            const result = await mammoth.extractRawText({arrayBuffer: arrayBuf});
            contentDom.value = result.value;
            if(!titleDom.value){
                titleDom.value=f.name.replace(/\.docx$/i,"");
            }
        }
        else{
            alert("仅支持 .txt 和 .docx 文件");
            contentDom.value = "";
        }
    }catch(err){
        alert("读取文件失败！docx文件损坏或者版本不兼容");
        console.error(err);
        contentDom.value = "";
    }
};

// 提交投稿 → 调用已有 /api 接口
submitBtn.onclick=async function(){
    const username=localStorage.getItem("username");
    if(!username){alert("请先登录账号");return;}
    const title=titleDom.value.trim();
    const content=contentDom.value.trim();
    if(!title){alert("请填写作品标题");return;}
    if(!content){alert("正文不能为空，请先上传txt/docx文件");return;} 
    try{
       const res=await fetch("/api?action=submitText",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                title:title,
                content:content,
                cover:"",
                author:username
            })
        });
        const data=await res.json();
        if(data.ok){
            alert(data.msg);
            location.href="/";
        }else{
            alert(data.msg);
        }
    }catch(err){
        alert("网络错误，投稿失败："+err.message);
        console.error(err);
    }
};
</script>
</body>
</html>
