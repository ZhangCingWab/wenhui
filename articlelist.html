<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>论坛广场 | 文汇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
body{background:#f7fafc;color:#2d3748;line-height:1.6;}
nav{padding:1rem 8%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.06);z-index:99;}
.logo{font-size:1.5rem;font-weight:700;color:#3182ce;cursor:pointer;}
.container{max-width:800px;margin:0 auto;padding:20px;}
.sort-bar{margin-bottom:20px;display:flex;align-items:center;gap:10px;}
#sortSelect{padding:6px 10px;border:1px solid #cbd5e0;border-radius:6px;font-size:1rem;}
.item{background:#fff;padding:18px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.05);cursor:pointer;}
.item h2{font-size:1.3rem;margin-bottom:8px;}
.meta{color:#718096;font-size:0.9rem;margin-bottom:8px;display:flex;gap:16px;}
.empty{text-align:center;padding:40px;color:#718096;}
</style>
</head>
<body>
<nav>
  <div class="logo" onclick="location.href='/'">文汇</div>
</nav>
<div class="container">
  <div class="sort-bar">
    <span>排序方式：</span>
    <select id="sortSelect">
      <option value="new">最新发布</option>
      <option value="like">点赞最多</option>
    </select>
  </div>
  <div id="listWrap"></div>
</div>
<script>
let currentSort = "new";
const username = localStorage.getItem("username") || "匿名用户";
window.onload = loadList;
document.getElementById("sortSelect").onchange = function(){
  currentSort = this.value;
  loadList();
}
async function loadList(){
  const wrap = document.getElementById("listWrap");
  wrap.innerHTML = "加载中...";
  try{
    const res = await fetch(`/api?action=articleList&sort=${currentSort}`);
    const d = await res.json();
    if(!d.ok || d.data.length===0){
      wrap.innerHTML = `<div class="empty">暂无帖子</div>`;
      return;
    }
    let html = "";
    d.data.forEach(art=>{
      html += `
      <div class="item" onclick="location.href='read.html?id=${art.id}'">
        <h2>${art.title}</h2>
        <div class="meta">
          <span>作者：${art.author}</span>
          <span>👍 ${art.like_count}</span>
        </div>
      </div>
      `
    })
    wrap.innerHTML = html;
  }catch(err){
    wrap.innerHTML = `<div class="empty">加载失败</div>`;
    console.error(err);
  }
}
</script>
</body>
</html>
