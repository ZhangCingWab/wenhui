<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读文章 | 文汇</title>
    <style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
body{background:#f7fafc;color:#2d3748;line-height:1.8;}
nav{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.06);padding:1rem 8%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99;}
.logo{font-size:1.5rem;font-weight:700;color:#3182ce;cursor:pointer;}
.container{max-width:800px;margin:0 auto;padding:30px 20px;}
.back-btn{color:#3182ce;background:none;border:none;font-size:1rem;cursor:pointer;margin-bottom:20px;}
.article-card{background:#fff;border-radius:14px;padding:32px;box-shadow:0 2px 12px rgba(0,0,0,0.07);}
.article-title{font-size:2rem;margin-bottom:12px;font-weight:bold;}
.meta-line{color:#718096;margin-bottom:24px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
.cover-img{width:100%;border-radius:10px;margin-bottom:24px;max-height:420px;object-fit:cover;display:none;}
.content{
    font-size:1.05rem;
    white-space: pre-line;
}
.content div{margin:0.4rem 0;}
.content p{margin:0.7rem 0;}
.content ol{padding-left:2rem;margin:0.6rem 0;}
.content ul{padding-left:2rem;margin:0.6rem 0;}
.content li{margin:0.3rem 0;}
.content b,.content strong{font-weight:bold;}
.content i,.content em{font-style:italic;}
.content u{text-decoration:underline;}
.content strike{text-decoration:line-through;}
.content br{display:block;content:"";margin:0.3rem 0;}
.like-btn{margin-top:24px;padding:10px 18px;border:none;border-radius:8px;background:#3182ce;color:white;font-size:1rem;cursor:pointer;}
.like-btn.liked{background:#e53e3e;}
.loading,.error{text-align:center;padding:80px 20px;font-size:1.1rem;color:#718096;}

/* 抖音风格评论样式 */
.comment-item{background:#fff;padding:16px;border-radius:10px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,0.04);}
.comment-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.comment-name{font-weight:bold;}
.comment-time{color:#718096;font-size:0.85rem;}
.comment-text{white-space:pre-wrap;margin:6px 0;}
.reply-target{color:#718096;font-size:0.9rem;}
.comment-action{display:flex;gap:14px;margin-top:8px;}
.comment-like-btn,.reply-btn{border:none;background:transparent;color:#3182ce;cursor:pointer;padding:4px 0;font-size:0.9rem;}
.comment-like-btn.liked{color:#e53e3e;}
.reply-input-box{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}
.reply-input-box textarea{flex:1;padding:10px;border:1px solid #e2e8f0;border-radius:8px;min-height:70px;resize:none;min-width:220px;}
.reply-submit{padding:8px 14px;border:none;border-radius:8px;background:#3182ce;color:white;cursor:pointer;align-self:flex-end;}
/* 子回复统一缩进，单层，不无限嵌套缩进 */
.child-comment{margin-left:22px;margin-top:12px;}
    </style>
</head>
<body>
    <nav>
        <div class="logo" onclick="location.href='index.html'">文汇</div>
        <div></div>
    </nav>
    <div class="container">
        <button class="back-btn" onclick="history.back()">← 返回文章库</button>
        <div id="loading">文章加载中...</div>
        <div id="error" style="display:none;">文章不存在或加载失败</div>
        <div id="articleBox" style="display:none;" class="article-card">
            <h1 id="title" class="article-title"></h1>
            <div class="meta-line">
                <span>作者：<span id="author"></span></span>
                <span>发布时间：<span id="time"></span></span>
                <span>点赞：<span id="likeCount"></span></span>
            </div>
            <img id="coverImg" class="cover-img">
            <div id="content" class="content"></div>
            <button id="likeBtn" class="like-btn">❤️ 点赞</button>
        </div>
        <div class="comment-wrap" style="margin-top:40px;">
            <h3 style="margin-bottom:16px;">💬 评论区</h3>
            <div class="comment-input-area" style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
                <textarea id="commentText" placeholder="写下你的评论..." style="flex:1;padding:12px;border:1px solid #e2e8f0;border-radius:8px;min-height:80px;resize:none;min-width:260px;"></textarea>
                <button class="btn-primary" id="submitComment" style="align-self:flex-end;padding:10px 18px;border:none;border-radius:8px;background:#3182ce;color:white;font-size:1rem;cursor:pointer;">提交评论</button>
            </div>
            <div id="commentList"></div>
        </div>
    </div>
<script>
const urlParams=new URLSearchParams(location.search);
const articleId=urlParams.get("id");
const username=localStorage.getItem("username")||"";
let articleData=null;

function loadArticle(){
    fetch(`/api?action=getText&id=${articleId}&username=${encodeURIComponent(username)}`)
    .then(res=>res.json())
    .then(data=>{
        document.getElementById("loading").style.display="none";
        if(!data.ok||!data.data){
            document.getElementById("error").style.display="block";
            return;
        }
        articleData=data.data;
        render(data.data);
    }).catch(()=>{
        document.getElementById("loading").style.display="none";
        document.getElementById("error").style.display="block";
    })
}
function render(d){
    document.getElementById("articleBox").style.display="block";
    document.getElementById("title").innerText=d.title;
    document.getElementById("author").innerText=d.author;
    document.getElementById("time").innerText=new Date(d.create_time).toLocaleString();
    document.getElementById("likeCount").innerText=d.like_count;
    document.getElementById("content").innerHTML=d.content;
    if(d.cover){
        const img=document.getElementById("coverImg");
        img.src=d.cover;
        img.style.display="block";
    }
    const likeBtn=document.getElementById("likeBtn");
    if(d.userLiked>0){
        likeBtn.classList.add("liked");
        likeBtn.innerText="❤️ 已点赞";
    }
    likeBtn.onclick=()=>doLike();
}
async function doLike(){
    if(!username){
        alert("请先登录");
        return;
    }
    const isCancel=articleData.userLiked>0;
    const res=await fetch(`/api?action=likeText&username=${encodeURIComponent(username)}`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({id:articleId,isCancel})
    });
    const ret=await res.json();
    if(ret.ok){
        articleData.like_count += isCancel ? -1 : 1;
        articleData.userLiked = isCancel ? 0 :1;
        document.getElementById("likeCount").innerText=articleData.like_count;
        const btn=document.getElementById("likeBtn");
        if(isCancel){
            btn.classList.remove("liked");
            btn.innerText="❤️ 点赞";
        }else{
            btn.classList.add("liked");
            btn.innerText="❤️ 已点赞";
        }
    }
}

const commentListDom = document.getElementById("commentList");
const commentTextDom = document.getElementById("commentText");
const submitCommentBtn = document.getElementById("submitComment");
const targetType = "text";
const targetId = articleId;

async function loadComments(){
  const res = await fetch(`/api?action=getComments&type=${targetType}&id=${targetId}&username=${encodeURIComponent(username)}`);
  const data = await res.json();
  if(!data.ok) return;
  commentListDom.innerHTML = "";
  const allComments = data.data;

  // 构建id -> 评论对象 映射，用来查找被回复的人
  const commentMap = {};
  allComments.forEach(c=>commentMap[c.id]=c);
  // 筛选顶级评论 parent_id=null
  const rootComments = allComments.filter(c=>c.parent_id===null);

  rootComments.forEach(root=>{
    const wrap = document.createElement("div");
    wrap.className="comment-item";
    let html = `
      <div class="comment-header">
        <span class="comment-name">${root.username}</span>
        <span class="comment-time">${new Date(root.create_time).toLocaleString()}</span>
      </div>
      <div class="comment-text">${root.content}</div>
      <div class="comment-action">
        <button class="comment-like-btn ${root.userLiked>0?'liked':''}" data-cid="${root.id}">❤️ ${root.like_count||0}</button>
        <button class="reply-btn" data-cid="${root.id}">回复</button>
      </div>
      <div class="reply-box" data-cid="${root.id}"></div>
    `;

    // 找出所有属于这条根评论的全部子回复（不管嵌套多少层，全部放下面，统一缩进）
    const childList = allComments.filter(c=>findRootId(c.id, root.id, allComments));
    childList.forEach(child=>{
      const targetComment = commentMap[child.parent_id];
      const targetName = targetComment?.username || "";
      html += `
        <div class="child-comment">
          <div class="comment-header">
            <span class="comment-name">${child.username}</span>
            <span class="comment-time">${new Date(child.create_time).toLocaleString()}</span>
          </div>
          <div class="reply-target">回复 @${targetName}</div>
          <div class="comment-text">${child.content}</div>
          <div class="comment-action">
            <button class="comment-like-btn ${child.userLiked>0?'liked':''}" data-cid="${child.id}">❤️ ${child.like_count||0}</button>
            <button class="reply-btn" data-cid="${child.id}">回复</button>
          </div>
          <div class="reply-box" data-cid="${child.id}"></div>
        </div>
      `;
    })
    wrap.innerHTML = html;
    commentListDom.appendChild(wrap);
  })

  // 点赞绑定
  document.querySelectorAll(".comment-like-btn").forEach(btn=>{
    btn.onclick = async function(){
      if(!username) return;
      const cid = this.dataset.cid;
      const isCancel = this.classList.contains("liked");
      await fetch(`/api?action=commentLike&username=${encodeURIComponent(username)}`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({comment_id:cid,isCancel})
      })
      loadComments();
    }
  })
  //回复按钮
  document.querySelectorAll(".reply-btn").forEach(btn=>{
    btn.onclick = function(){
      if(!username) return;
      const cid = this.dataset.cid;
      const box = document.querySelector(`.reply-box[data-cid="${cid}"]`);
      if(box.innerHTML){box.innerHTML="";return;}
      box.innerHTML=`
        <div class="reply-input-box">
          <textarea placeholder="写下回复..."></textarea>
          <button class="reply-submit" data-pid="${cid}">发送</button>
        </div>
      `;
      box.querySelector(".reply-submit").onclick = async function(){
        const pid = this.dataset.pid;
        const txt = box.querySelector("textarea").value.trim();
        if(!txt) return;
        await fetch(`/api?action=comment`,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            target_type: targetType,
            target_id: targetId,
            username: username,
            content: txt,
            parent_id: pid
          })
        })
        loadComments();
      }
    }
  })
}

//递归查找：这条评论的根是不是rootId，用于收集所有子回复
function findRootId(currentCid, targetRootId, all){
  let c = all.find(x=>x.id === currentCid);
  while(c){
    if(c.parent_id === targetRootId) return true;
    c = all.find(x=>x.id === c.parent_id);
  }
  return false;
}

//提交主评论
submitCommentBtn.onclick = async function(){
  if(!username) return;
  const content = commentTextDom.value.trim();
  if(!content) return;
  await fetch(`/api?action=comment`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      target_type: targetType,
      target_id: targetId,
      username: username,
      content: content,
      parent_id: null
    })
  })
  commentTextDom.value="";
  loadComments();
}

window.onload=()=>{
  loadArticle();
  loadComments();
}
</script>
<script src="/sidebar.js"></script>
</body>
</html>
